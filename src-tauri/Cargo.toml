[package]
name = "oneget"
version = "0.1.0"
edition = "2021"

[lib]
name = "oneget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
cap-std = "4.0.3"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
keyring = "4.2.0"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
regex = "1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1", features = ["process", "rt", "time"] }
unicode-normalization = "0.1"
url = "2.5.8"
zeroize = "1.9.1"

[dev-dependencies]
getrandom = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
