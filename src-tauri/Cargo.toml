[package]
name = "oneget"
version = "0.1.0"
edition = "2021"

[lib]
name = "oneget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
cap-std = "4.0.3"
keyring = "4.2.0"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
secrecy = "0.10.3"
tauri = { version = "2.12.5", features = [] }
tokio = { version = "1", features = ["process", "rt", "time"] }
unicode-normalization = "0.1"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
