[package]
name = "oneget"
version = "0.1.0"
edition = "2021"

[lib]
name = "oneget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
axum = "=0.8.9"
bytes = "=1.12.1"
cap-std = "4.0.3"
ed25519-dalek = "3.0.0"
futures-util = "=0.3.34"
hex = "0.4.3"
http-body-util = "=0.1.5"
keyring = "4.2.0"
percent-encoding = "=2.3.2"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
rand = "=0.10.3"
regex = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "=0.42.0", default-features = false, features = ["backup", "bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1", features = ["macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tower = "=0.5.3"
unicode-normalization = "0.1"
url = "2.5.8"
uuid = { version = "=1.29.2", features = ["v4"] }
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
getrandom = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
